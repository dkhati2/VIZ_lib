[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dk-eda-viz"
version = "0.1.0"
description = "Boring, aesthetic EDA helpers for pandas — check missing data, summarize, and plot without matplotlib/seaborn defaults."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
